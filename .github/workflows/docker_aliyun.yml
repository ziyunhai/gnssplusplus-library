name: Build gnssplusplus-library & Push to Aliyun ACR
run-name: ${{ github.actor }} build libgnsspp runtime image
on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker_aliyun.yml'   # 请根据实际文件名调整
  workflow_dispatch:

jobs:
  build-push:
    name: Build & Push libgnsspp Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push libgnsspp image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile          # 使用项目根目录下的 Dockerfile
          # target: <如果有多阶段构建且需要指定目标阶段，可在此添加>
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/libgnsspp:latest
          provenance: false
          sbom: false
          outputs: type=registry,oci-mediatypes=false
          # cache-from: type=gha
          # cache-to: type=gha,mode=max

      - name: Clean up Docker resources
        if: always()
        run: docker system prune -f

      - name: Build success notification
        if: success()
        run: echo "✅ libgnsspp 镜像构建并推送至阿里云 ACR 完成"
